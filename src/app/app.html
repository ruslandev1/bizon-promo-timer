<main class="promo">
  <header class="promo__logo">
    <img class="promo__logo-icon" src="/bizon-logo.webp" alt="Bizon icon" />
  </header>

  <section class="promo__content" aria-label="Bizon lottery countdown">
    <div class="promo__headline">
      <img
        class="promo__headline-img"
        src="/logo.webp"
        alt="LOTEREYA – YAY BOYUNCA! HƏR HƏFTƏ BİR MAŞIN"
      />
    </div>

    <p class="promo__date">01.06.2026 TARİXİNDƏ</p>
    <p class="promo__subtitle">START VERİLƏCƏK LOTEREYA ÜÇÜN GERİ SAYIM BAŞLADI.</p>

    <div class="promo__timer" role="timer" aria-live="polite">
      <div class="promo__unit">
        <span class="promo__value">{{ timeLeft().days | number: '2.0' }}</span>
        <span class="promo__label">GÜN</span>
      </div>
      <div class="promo__unit">
        <span class="promo__value">{{ timeLeft().hours | number: '2.0' }}</span>
        <span class="promo__label">SAAT</span>
      </div>
      <div class="promo__unit">
        <span class="promo__value">{{ timeLeft().minutes | number: '2.0' }}</span>
        <span class="promo__label">DƏQİQƏ</span>
      </div>
      <div class="promo__unit">
        <span class="promo__value">{{ timeLeft().seconds | number: '2.0' }}</span>
        <span class="promo__label">SANİYƏ</span>
      </div>
    </div>
  </section>
</main>
